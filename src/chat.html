<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="fonts/fonts.css">
  <title>PixelPet</title>
  <style>
    :root {
      --window: #ececec;
      --titlebar: #dcdcdc;
      --body: #f5f5f5;
      --bubble: #e5e5ea;
      --mine: #3a3a3c;
      --ink: #1c1c1e;
      --muted: #8e8e93;
      --line: #c7c7cc;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; }
    body { font-family: "Pretendard", -apple-system, sans-serif; color: var(--ink); padding: 6px; }
    button { font: inherit; }

    .win { position: relative; height: 100%; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: var(--body); border: 1px solid rgba(0,0,0,.12); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 22px rgba(0,0,0,.16); }

    header { flex: none; height: 40px; background: var(--titlebar); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px 0 12px; position: relative; -webkit-app-region: drag; }
    .lights { display: flex; gap: 8px; -webkit-app-region: no-drag; z-index: 1; }
    .lights button { width: 12px; height: 12px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,.18); padding: 0; cursor: pointer; }
    .lights .red { background: #ff5f57; }
    .lights .yellow { background: #febc2e; }
    .lights .green { background: #28c840; cursor: default; }
    .title { position: absolute; left: 70px; right: 70px; text-align: center; font-size: 13px; font-weight: 600; color: #4a4a4c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #b0b0b5; flex: none; }
    .dot.on { background: #34c759; }
    .more { margin-left: auto; -webkit-app-region: no-drag; z-index: 1; border: 0; background: none; width: 28px; height: 24px; border-radius: 6px; font-size: 16px; font-weight: 700; color: #4a4a4c; cursor: pointer; letter-spacing: 1px; }
    .more:hover { background: rgba(0,0,0,.07); }

    /* 방 탭 */
    .tabs { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: var(--window); border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; position: relative; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #3a3a3c; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tab.on { background: var(--mine); border-color: var(--mine); color: #fff; }
    .tab .badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
    .tab.add { padding: 0 11px; font-size: 16px; font-weight: 500; color: #6b6b70; }

    .members { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 6px; }
    .members::-webkit-scrollbar { display: none; }
    .member { flex: none; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px 0 5px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: #3a3a3c; font-size: 11.5px; font-weight: 600; }
    .member.me { background: #e5e5ea; border-color: #e5e5ea; }

    #list { flex: 1; overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: flex; gap: 6px; align-items: flex-end; max-width: 88%; }
    .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg canvas { flex: none; margin-bottom: 2px; }
    .meta { font-size: 10.5px; color: var(--muted); margin: 0 6px 3px; }
    .mine .meta { text-align: right; }

    /* 꼬리 달린 말풍선 */
    .text { position: relative; padding: 8px 13px; border-radius: 18px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; background: var(--bubble); color: var(--ink); }
    .text::before, .text::after { content: ''; position: absolute; bottom: 0; height: 18px; }
    .text::before { left: -7px; width: 20px; background: var(--bubble); border-bottom-right-radius: 15px; }
    .text::after { left: -10px; width: 10px; background: var(--body); border-bottom-right-radius: 10px; }
    .mine .text { background: var(--mine); color: #fff; }
    .mine .text::before { left: auto; right: -7px; background: var(--mine); border-bottom-right-radius: 0; border-bottom-left-radius: 15px; }
    .mine .text::after { left: auto; right: -10px; border-bottom-right-radius: 0; border-bottom-left-radius: 10px; }

    .empty { margin: auto; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.7; }

    form#f { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--window); border-top: 1px solid var(--line); }
    .pill { flex: 1; display: flex; align-items: center; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
    .pill input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 14px; background: transparent; color: var(--ink); }
    .pill:focus-within { border-color: #8e8e93; }
    .send { border: 0; background: none; color: #3a3a3c; font-size: 12.5px; font-weight: 700; letter-spacing: .5px; cursor: pointer; padding: 6px 2px; }
    .send:active { opacity: .5; }

    /* 방 추가·수정 시트 */
    .sheet-bg { position: absolute; inset: 40px 0 0; background: rgba(0,0,0,.18); display: none; align-items: flex-end; }
    .sheet-bg.show { display: flex; }
    .sheet { width: 100%; max-height: 100%; overflow-y: auto; background: var(--window); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 16px 14px 14px; }
    .sheet h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .sheet label { display: block; font-size: 11.5px; font-weight: 700; color: #4a4a4c; margin: 12px 0 6px; }
    .field { display: flex; gap: 6px; }
    .field .pill { height: 34px; }
    .ghost { flex: none; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #3a3a3c; font-size: 12px; font-weight: 600; cursor: pointer; }
    .code { flex: 1; display: flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: #e5e5ea; font-size: 13px; color: #3a3a3c; user-select: all; }
    .animals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .animal { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 5px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-size: 11px; color: #3a3a3c; }
    .animal.sel { background: var(--mine); border-color: var(--mine); color: #fff; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .err { color: var(--red); font-size: 12px; min-height: 16px; margin-top: 10px; }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    .actions button { flex: 1; height: 36px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .cancel { border: 1px solid var(--line); background: #fff; color: #3a3a3c; }
    .primary { border: 0; background: var(--mine); color: #fff; }
    .leave { display: block; width: 100%; margin-top: 10px; border: 0; background: none; color: var(--red); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px; }
  </style>
</head>
<body>
  <div class="win">
    <header>
      <div class="lights">
        <button id="close" class="red" title="닫기"></button>
        <button id="mini" class="yellow" title="숨기기"></button>
        <button class="green" tabindex="-1"></button>
      </div>
      <div class="title"><span id="dot" class="dot"></span><span id="room"></span></div>
      <button id="more" class="more" title="방 설정">⋯</button>
    </header>
    <div id="tabs" class="tabs"></div>
    <div id="members" class="members"></div>
    <div id="list"></div>
    <form id="f">
      <label class="pill"><input id="t" placeholder="iMessage" maxlength="500" autocomplete="off"></label>
      <button class="send">SEND</button>
    </form>

    <div id="sheetBg" class="sheet-bg">
      <div class="sheet">
        <h2 id="sheetTitle"></h2>
        <label for="rName">방 이름 <span style="font-weight:400;color:var(--muted)">(내 화면에서만 보여요)</span></label>
        <div class="field"><span class="pill"><input id="rName" maxlength="12" placeholder="예: 대학친구"></span></div>

        <label for="rCode">방 코드</label>
        <div id="codeNew" class="field">
          <span class="pill"><input id="rCode" maxlength="40" placeholder="친구에게 받은 코드"></span>
          <button id="gen" type="button" class="ghost">새 코드</button>
        </div>
        <div id="codeShow" class="field">
          <span id="codeText" class="code"></span>
          <button id="copy" type="button" class="ghost">복사</button>
        </div>
        <div id="codeHint" class="hint">친구에게 받은 코드를 넣으면 그 방에 들어가요. 새 코드를 만들어 친구에게 알려줄 수도 있어요.</div>

        <label>바탕화면 고양이</label>
        <div id="cats" class="animals"></div>

        <div id="sheetErr" class="err"></div>
        <div class="actions">
          <button id="cancel" type="button" class="cancel">취소</button>
          <button id="ok" type="button" class="primary"></button>
        </div>
        <button id="leave" type="button" class="leave">이 방 나가기</button>
      </div>
    </div>
  </div>
  <script src="sprites.js"></script>
  <script src="util.js"></script>
  <script src="chat.js"></script>
</body>
</html>
